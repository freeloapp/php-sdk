name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Called by auto-tag.yml, which pushes the tag itself. A `GITHUB_TOKEN` push
  # does not trigger the `push: tags` event above, so the automated path has to
  # invoke this workflow directly and pass the version in.
  workflow_call:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 2.4.0)'
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # On the tag-push path this is the tag itself; when called by
          # auto-tag.yml the ref is the branch, so check out the tag explicitly.
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION="${{ inputs.version }}"

          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # Extract the changelog for this version: everything between this
          # version's heading and the next "## [" heading. An awk range
          # (/## \[$VERSION\]/,/## \[/) does NOT work here — the opening line
          # matches the closing pattern too, so the range collapses to that one
          # line and the notes come out empty.
          CHANGELOG=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            echo "::error::No changelog section found for version $VERSION in CHANGELOG.md"
            exit 1
          fi

          # Save to file for GitHub release
          echo "$CHANGELOG" > RELEASE_NOTES.md

          # Also output for use in release
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Explicit — on the workflow_call path the ref is a branch, so the
          # action cannot infer the tag.
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Packagist
        if: success()
        run: |
          echo "Release created successfully!"
          echo "Packagist should auto-update via webhook."
          echo "If not, visit https://packagist.org/packages/freeloapp/php-sdk and click 'Update'"
