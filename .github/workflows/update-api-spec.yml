name: Update API Spec

on:
  schedule:
    # Mondays 06:00 UTC — gives reviewers the rest of the week to land
    # any drift PR before the next regen.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Download upstream OpenAPI spec
        run: make spec

      - name: Regenerate models and endpoints digest
        run: composer generate

      - name: Check resource endpoint coverage
        id: endpoints
        run: |
          if composer check:endpoints > endpoint-coverage.txt 2>&1; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '## Endpoint coverage'
            echo '```'
            cat endpoint-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        # Non-blocking: new upstream endpoints have no hand-written resource yet,
        # which is exactly the drift we want the PR to surface — not a reason to
        # abort the regen. The drift is reported in the PR body and re-checked
        # (as a hard gate) by the OpenAPI Sync Check workflow on the PR.
        continue-on-error: true

      - name: Run static analysis against new client
        run: composer analyse

      - name: Run tests against new client
        run: composer test

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-api-spec
          delete-branch: true
          commit-message: "chore: refresh OpenAPI spec and regenerate client"
          title: "chore: refresh OpenAPI spec and regenerate client"
          body: |
            Automated weekly refresh of the Freelo OpenAPI spec.

            - `.openapi/freelo-api.yaml` updated to upstream HEAD.
            - `src/Generated/**` regenerated via `composer generate:models`.
            - `docs/ENDPOINTS.md` regenerated via `composer generate:endpoints`.
            - Static analysis (PHPStan + PHPCS) and tests pass against the new client.

            ⚠️ Endpoint drift: ${{ steps.endpoints.outputs.drift == 'true' && 'NEW endpoints are not yet implemented in src/Resource/ — see the OpenAPI Sync Check on this PR and the run summary. Add the resource methods (or ignore-list the endpoints) before merging.' || 'none — every spec operation is implemented or ignore-listed.' }}

            Review the diff for any breaking changes before merging.
          labels: |
            dependencies
            automated
          add-paths: |
            .openapi/freelo-api.yaml
            src/Generated/**
            docs/ENDPOINTS.md
