name: OpenAPI Sync Check

on:
  push:
    paths:
      - '.openapi/**'
      - 'src/Generated/**'
      - 'docs/ENDPOINTS.md'
      - 'scripts/generate-models.php'
      - 'scripts/generate-endpoints-digest.php'
  pull_request:
    paths:
      - '.openapi/**'
      - 'src/Generated/**'
      - 'docs/ENDPOINTS.md'
      - 'scripts/generate-models.php'
      - 'scripts/generate-endpoints-digest.php'
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

jobs:
  openapi-check:
    name: OpenAPI Spec Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate models and check for drift
        run: composer generate:check
