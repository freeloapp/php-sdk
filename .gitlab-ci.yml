stages:
  - test
  - quality

# Install Composer into bare php:*-cli images
.install-composer: &install-composer
  before_script:
    - apt-get update -qq && apt-get install -yqq git unzip libzip-dev > /dev/null
    - docker-php-ext-install zip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

# Template for test jobs — uses `composer update` so each PHP version
# resolves its own compatible dependency tree.
.test-job:
  <<: *install-composer
  stage: test
  cache:
    key: composer-${CI_JOB_NAME}
    paths:
      - vendor/
    policy: pull-push
  script:
    - composer update --prefer-dist --no-progress --no-interaction
    - composer test

# Template for quality jobs — uses `composer install` from lock file.
.quality-job:
  <<: *install-composer
  stage: quality
  cache:
    key: composer-quality
    paths:
      - vendor/
    policy: pull-push
  script:
    - composer install --prefer-dist --no-progress --no-interaction

# Test matrix across PHP versions
test:php8.1:
  extends: .test-job
  image: php:8.1-cli

test:php8.2:
  extends: .test-job
  image: php:8.2-cli

test:php8.3:
  extends: .test-job
  image: php:8.3-cli

test:php8.4:
  extends: .test-job
  image: php:8.4-cli

phpstan:
  extends: .quality-job
  image: php:8.4-cli
  script:
    - composer install --prefer-dist --no-progress --no-interaction
    - composer phpstan

phpcs:
  extends: .quality-job
  image: php:8.4-cli
  script:
    - composer install --prefer-dist --no-progress --no-interaction
    - composer phpcs
