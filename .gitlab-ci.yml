stages:
  - test
  - quality

# Cache Composer dependencies between jobs
.composer-cache: &composer-cache
  cache:
    key: composer-${CI_COMMIT_REF_SLUG}
    paths:
      - vendor/
    policy: pull-push

# Template for PHP jobs
.php-job:
  <<: *composer-cache
  before_script:
    - composer install --prefer-dist --no-progress --no-interaction

# Test matrix across PHP versions
test:php8.1:
  extends: .php-job
  stage: test
  image: php:8.1-cli
  script:
    - composer test

test:php8.2:
  extends: .php-job
  stage: test
  image: php:8.2-cli
  script:
    - composer test

test:php8.3:
  extends: .php-job
  stage: test
  image: php:8.3-cli
  script:
    - composer test

test:php8.4:
  extends: .php-job
  stage: test
  image: php:8.4-cli
  script:
    - composer test

phpstan:
  extends: .php-job
  stage: quality
  image: php:8.4-cli
  script:
    - composer phpstan

phpcs:
  extends: .php-job
  stage: quality
  image: php:8.4-cli
  script:
    - composer phpcs
